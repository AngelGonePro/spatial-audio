<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>7.1 Upmixer Engine</title>
<style>
body { background:#0d0d0d; color:#e0e0e0; font-family:Segoe UI; padding:30px; }
h1 { color:#00c8ff; }
#dropzone { border:2px dashed #00c8ff55; padding:40px; text-align:center; border-radius:12px; cursor:pointer; }
.file-info { margin-top:10px; color:#aaa; }
button { margin-top:15px; width:100%; padding:12px; background:#111; border:1px solid #333; color:#00c8ff; cursor:pointer; }
pre { margin-top:15px; background:#0a0a0a; padding:12px; color:#7fff7f; white-space:pre-wrap; }
.status { margin-top:10px; color:#ffcc00; }
</style>
</head>
<body>
<h1>🎧 7.1 Upmixer Engine</h1>
<div id="dropzone">Drag & Drop Audio File</div>
<input type="file" id="fileInput" hidden>
<div class="file-info" id="fileInfo"></div>
<button onclick="run()">RUN Upmixer PROCESS</button>
<div class="status" id="status">Idle</div>
<pre id="output"></pre>
<script>
let filePath = "";
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
dropzone.onclick = () => fileInput.click();
dropzone.addEventListener("dragover", e => e.preventDefault());
dropzone.addEventListener("drop", e => {
  e.preventDefault();
  loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", e => { loadFile(e.target.files[0]); });
function loadFile(file) {
  filePath = window.electronAPI.getPath(file);
  document.getElementById("fileInfo").innerHTML =
    "<b>File:</b> " + file.name + "<br><b>Path:</b> " + filePath;
}
function run() {
  const ffmpeg = "C:\\Users\\Angel\\Documents\\ffmpeg-8.0.1-full_build\\bin\\ffmpeg.exe";
  const outPath = filePath.replace(/\.[^\.]+$/, "") + " - 71Upmix.flac";
const filter = `
[0:a]asplit=6[main][bass_src][amb_src][rear_src][center_src][height_src];
[bass_src]lowpass=f=90[bass_lp];
[bass_lp]equalizer=f=50:width_type=o:width=1:g=2[bass_eq];
[bass_eq]equalizer=f=80:width_type=o:width=1:g=1.5[bass_eq2];
[bass_eq2]pan=7.1|FL=0.35*c0|FR=0.35*c1|FC=0.0*c0|LFE=0.72*c0|BL=0.0*c0|BR=0.0*c0|SL=0.0*c0|SR=0.0*c0[lfe_71];
[center_src]highpass=f=150,lowpass=f=4000[center_hp];
[center_hp]equalizer=f=900:width_type=o:width=1.5:g=1[center_pres];
[center_pres]equalizer=f=2200:width_type=o:width=0.5:g=-2.5[center_scratch1];
[center_scratch1]equalizer=f=2800:width_type=o:width=0.5:g=-2[center_scratch2];
[center_scratch2]equalizer=f=3500:width_type=o:width=1.0:g=0.5[center_air];
[center_air]equalizer=f=200:width_type=o:width=1:g=-1.5[center_mud];
[center_mud]pan=7.1|FL=0.30*c0|FR=0.30*c1|FC=0.50*c0+0.50*c1|LFE=0.0*c0|BL=0.0*c0|BR=0.0*c1|SL=0.0*c0|SR=0.0*c0[center_71];
[main]equalizer=f=45:width_type=o:width=1:g=1.5[main_bass];
[main_bass]equalizer=f=80:width_type=o:width=1:g=1.5[main_bass2];
[main_bass2]equalizer=f=300:width_type=o:width=1.5:g=1[main_low_mid];
[main_low_mid]equalizer=f=600:width_type=o:width=1.5:g=1[main_mid];
[main_mid]equalizer=f=180:width_type=o:width=1.5:g=-1[main_mud];
[main_mud]equalizer=f=12000:width_type=o:width=2:g=1.5[main_air];
[main_air]pan=7.1|FL=c0|FR=c1|FC=0.0*c0|LFE=0.0*c0|BL=0.0*c0|BR=0.0*c1|SL=0.0*c0|SR=0.0*c0[front];
[amb_src]highpass=f=120,lowpass=f=8000[amb_hp];
[amb_hp]equalizer=f=1000:width_type=o:width=2:g=-1.5[amb_notch];
[amb_notch]extrastereo=m=0.60[amb_wide];
[amb_wide]pan=7.1|FL=0.0*c0|FR=0.0*c1|FC=0.0*c0|LFE=0.0*c0|BL=0.0*c0|BR=0.0*c1|SL=0.55*c0|SR=0.55*c1[side_71];
[rear_src]highpass=f=150,lowpass=f=6000[rear_hp];
[rear_hp]equalizer=f=800:width_type=o:width=2:g=-1.5[rear_notch];
[rear_notch]extrastereo=m=0.50[rear_wide];
[rear_wide]adelay=delays=6|6:all=1[rear_delay];
[rear_delay]pan=7.1|FL=0.0*c0|FR=0.0*c1|FC=0.0*c0|LFE=0.0*c0|BL=0.50*c0|BR=0.50*c1|SL=0.0*c0|SR=0.0*c0[rear_71];
[height_src]highpass=f=3500,lowpass=f=16000[height_hp];
[height_hp]equalizer=f=8000:width_type=o:width=2:g=1.5[height_air];
[height_air]extrastereo=m=0.50[height_wide];
[height_wide]pan=7.1|FL=0.0*c0|FR=0.0*c1|FC=0.0*c0|LFE=0.0*c0|BL=0.0*c0|BR=0.0*c1|SL=0.35*c0|SR=0.35*c1[height_71];
[front][center_71][lfe_71][side_71][rear_71][height_71]amix=inputs=6:weights=1 0.90 0.88 0.68 0.60 0.48[premix];
[premix]loudnorm=I=-14:TP=-1.0:LRA=11[out]
`.split('\n').map(l => l.trim()).filter(l => l.length > 0).join(' ');
const args = [
  "-i", filePath,
  "-filter_complex", filter,
  "-map", "[out]",
  "-map", "0:v?",
  "-map_metadata", "0",
  "-map_metadata:s:a:0", "0:s:a:0",
  "-metadata:s:a:0", "WAVEFORMATEXTENSIBLE_CHANNEL_MASK=0x63F",
  "-c:a", "flac",
  "-c:v", "copy",
  "-ar", "48000",
  "-sample_fmt", "s32",
  outPath
];
  document.getElementById("status").textContent = "Processing...";
  window.electronAPI.runFFmpeg({ ffmpeg, args }).then(res => {
    if (res.code !== 0) {
      document.getElementById("status").textContent = "❌ Failed";
      document.getElementById("output").textContent = res.stderr;
    } else {
      document.getElementById("status").textContent = "✅ Done";
      document.getElementById("output").textContent = "OUTPUT:\n" + outPath;
    }
  });
}
</script>
</body>
</html>
